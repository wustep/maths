name = "maths"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Maths", "All"]

# Mirror openai/ten-proofs tooling: Lean 4.32.0 + mathlib on the same rev.
# Comparator is optional independent-kernel checking; enable when we have
# a result worth exporting. See https://github.com/openai/ten-proofs

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

[[lean_lib]]
name = "Maths"

[[lean_lib]]
name = "All"
