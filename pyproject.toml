[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maths"
version = "0.1.0"
description = "Private scaffolding for attacking hard research-level math problems."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Stephen Wu" }]
license = { text = "MIT" }
dependencies = [
  "sympy==1.14.0",
  "numpy==2.5.2",
  "scipy==1.18.0",
  "mpmath==1.3.0",
  "gmpy2==2.3.1",
  "python-flint==0.9.0",
  "pandas==3.0.5",
  "matplotlib==3.11.1",
  "networkx==3.6.1",
  "galois==0.4.11",
  "pulp==3.3.2",
  "ortools==9.15.6755",
  "cvxpy==1.9.2",
  "z3-solver==5.1.0.0",
  "jupyter==1.1.1",
  "ipython==9.16.1",
  "pytest==9.1.1",
  "tqdm==4.70.0",
  "joblib==1.5.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.urls]
Homepage = "https://github.com/wustep/maths"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
