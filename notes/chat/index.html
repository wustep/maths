ne column off one table cell. If it admits a small enough 2-partition, it re-seeds the whole family.\n\nNote: problems/covering/PROBLEM.md currently quotes Green's Problem 40 range as 1 ≤ f(2) ≤ 1.4238. That is stale — arXiv:2511.02542 already improved the upper bound to ≈1.3203. Fix this in the new note; do not propagate the error.\n\nVerified inputs (use these; do not re-derive by search)\n\nThe 50 columns of H, as integers over F₂^10 (bit i = row i+1, LSB first). These match problems/covering/compute/witness_r10_n50.json:\n\n[1, 2, 4, 15, 16, 32, 65, 86, 128, 173, 183, 202, 212, 247, 256, 297, 320, 329,  341, 366, 373, 381, 391, 403, 438, 460, 479, 491, 502, 559, 576, 608, 653, 734,  742, 754, 771, 777, 789, 821, 846, 855, 869, 881, 893, 897, 927, 981, 1003, 1004] \n\nA valid (2,0)-partition into 10 blocks — this is the new ingredient the original run never computed, and it is what unlocks everything downstream:\n\nblock 0: [2, 128, 202, 212, 771, 855, 897, 981] block 1: [86] block 2: [381, 893, 1003] block 3: [183, 297] block 4: [1, 65, 247, 256, 320, 438, 502, 734] block 5: [15, 173, 329, 366, 460, 559, 653, 846] block 6: [4, 16, 391, 491, 742, 754, 869, 881] block 7: [479, 1004] block 8: [403] block 9: [32, 341, 373, 576, 608, 777, 789, 821, 927] \n\nThis gives p(H) = 10, versus the paper's p(H_KR) = 11. Treat both the columns and the partition as claims to be verified by your own code, not as trusted input. If any check fails, stop and report — do not patch around it.\n\nWhat to build\n\nCreate problems/covering/result/ with this layout:\n\nresult/   NOTE.md                 the writeup (see below)   RESULT.md               one-page summary: claim, table, how to verify   PRIORITY.md             literature / priority checklist   data/     H_r10_n50.txt         copied from ../compute/, unchanged     partition_p10.json    columns + block assignment, with a schema comment     H_r18_n815.txt        generated     H_r20_n1631.txt       generated     kr_r10_n51.txt   <script>
  (function () {
    const AGENTS = {
      "bc-3330e5e4-491e-4b2b-90c7-fbe47fecd449": {
        title: "C7 fifth power Grok 4.6",
        branch: "cursor/c7-shannon-fifth-power-d449",
        pr: 1,
        files: 37,
        additions: 4032,
        url: "https://github.com/wustep/maths/pull/1",
        state: "Done"
      },
      "bc-9b575b07-97e3-4da8-ac81-065cc8f05755": {
        title: "vdw-w27: verified 3703 residue coloring, no dent at 3704",
        branch: "cursor/vdw-w27-lower-bound-5755",
        pr: 2,
        files: 39,
        additions: 2648,
        url: "https://github.com/wustep/maths/pull/2",
        state: "Done"
      }
    };

    let data = null;
    let playTimer = null;
    let playIndex = 0;
    let playing = false;

    function $(id) { return document.getElementById(id); }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderMd(raw) {
      if (!raw) return "";
      let t = escapeHtml(raw);
      t = t.replace(/```([\s\S]*?)```/g, function (_, code) {
        return "<pre><code>" + code + "</code></pre>";
      });
      t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
      t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      t = t.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
      t = t.replace(/(^|[^">])(https?:\/\/[^\s<]+)/g, function (_, pre, url) {
        return pre + '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + "</a>";
      });
      return t;
    }

    function shortTime(ts) {
      if (!ts) return "";
      const m = ts.match(/(\d{1,2}:\d{2}\s*[AP]M)/);
      return m ? m[1] : "";
    }

    function dayLabel(ts) {
      if (!ts) return "";
      return ts.replace(" (UTC-7)", "").replace(", 2026,", ",");
    }

    function figBlock(im) {
      if (!im) return "";
      if (im.missing || !im.src) {
        return '<div class="missing">Missing figure<br><code>' +
          escapeHtml(im.original || "") + "</code></div>";
      }
      return '<img class="fig" src="' + escapeHtml(im.src) + '" alt="">';
    }

    function attachChip(att) {
      if (!att) return "";
      const name = escapeHtml(att.filename || (att.original || "").split("/").pop() || "file");
      if (att.missing || !att.src) {
        return '<div class="missing">Missing file<br><code>' + escapeHtml(att.original || "") + "</code></div>";
      }
      return '<a class="attach" href="' + escapeHtml(att.src) + '" target="_blank" rel="noopener">' + name + "</a>";
    }

    function agentCard(m) {
      const info = AGENTS[m.bcId] || {};
      const title = escapeHtml(info.title || m.label || "Cloud agent");
      const branch = info.branch ? escapeHtml(info.branch) + (info.pr ? " PR #" + info.pr : "") : escapeHtml(m.bcId || "");
      const stats = info.files != null
        ? ('± ' + info.files + ' files changed <span class="add">+' + info.additions + "</span>")
        : "";
      const done = info.state === "Done" ? '<span class="badge"><i></i>Done</span>' : "";
      const view = info.url
        ? '<a href="' + info.url + '" target="_blank" rel="noopener">View PR ↗</a>'
        : "";
      return '<div class="card"><div class="card-head"><h3>' + title + "</h3>" + done +
        '</div><div class="branch">⎇ ' + branch + "</div>" +
        (stats ? '<div class="stats">' + stats + "</div>" : "") +
        '<div class="card-actions">' + view + "</div></div>";
    }

    function renderMessage(m, i) {
      const row = document.createElement("div");
      row.className = "row " + (m.role === "user" ? "user" : "math");
      const col = document.createElement("div");
      col.className = "col";
      let inner = "";
      if (m.type === "widget" && m.widget) {
        const w = m.widget;
        const opts = (w.options || []).map(function (o) {
          return '<div class="opt' + (o.style === "primary" ? " primary" : "") + '">' +
            escapeHtml(o.label || o.value || "") + "</div>";
        }).join("");
        inner = '<div class="card"><div class="kicker">' + escapeHtml(w.prompt || "") +
          "</div><div class=\"opts\">" + opts + "</div></div>";
      } else if (m.type === "secret-request") {
        const s = m.secret || {};
        inner = '<div class="card"><div class="kicker">' +
          escapeHtml(s.label || "Secret") + "</div></div>";
      } else if (m.type === "cursor-agent") {
        inner = agentCard(m);
      } else if (m.type === "attachment") {
        inner = '<div class="bubble">' + attachChip(m.attachment) + "</div>";
      } else {
        inner = '<div class="bubble">' + renderMd(m.text || "");
        (m.images || []).forEach(function (im) { inner += figBlock(im); });
        if (m.attachment) inner += attachChip(m.attachment);
        inner += "</div>";
      }
      col.innerHTML = inner;
      row.appendChild(col);
      return row;
    }

    function build(showUntil) {
      const log = $("log");
      log.innerHTML = "";
      const msgs = data.messages;
      const limit = showUntil == null ? msgs.length : showUntil;
      let lastDay = "";
      for (let i = 0; i < limit; i++) {
        const m = msgs[i];
        if (m.role === "user" && m.timestamp) {
          const key = m.timestamp.replace(/:\\d{2} /, ":xx ");
          if (key !== lastDay) {
            const d = document.createElement("div");
            d.className = "day";
            d.textContent = dayLabel(m.timestamp);
            log.appendChild(d);
            lastDay = key;
          }
        }
        log.appendChild(renderMessage(m, i));
      }
      const thread = $("thread");
      thread.scrollTop = thread.scrollHeight;
    }

    function stopPlay() {
      playing = false;
      if (playTimer) { clearTimeout(playTimer); playTimer = null; }
      $("playBtn").classList.remove("playing"); $("playBtn").setAttribute("aria-label","Play");
    }

    function stepPlay() {
      if (!playing) return;
      if (playIndex >= data.messages.length) { stopPlay(); return; }
      playIndex += 1;
      build(playIndex);
      const m = data.messages[playIndex - 1] || {};
      let delay = 60;
      if (m.role === "user") delay = 200;
      if ((m.images && m.images.length) || m.type === "widget" || m.type === "attachment") delay = 320;
      playTimer = setTimeout(stepPlay, delay);
    }

    function startPlay(from) {
      stopPlay();
      playing = true;
      playIndex = from == null ? 0 : from;
      $("playBtn").classList.add("playing"); $("playBtn").setAttribute("aria-label","Pause");
      build(playIndex);
      stepPlay();
    }

    function loadData(obj) {
      data = obj;
      $("playBtn").onclick = function () {
        if (playing) stopPlay();
        else startPlay(playIndex && playIndex < data.messages.length ? playIndex : 0);
      };
      const thread = $("thread");
      const params = new URLSearchParams(location.search);
      if (params.get("until")) build(parseInt(params.get("until"), 10));
      else build(null);
    }

    function fromEmbed() {
      const el = $("transcript");
      const txt = (el.textContent || "").trim();
      if (!txt) return null;
      return JSON.parse(txt);
    }

    const embedded = fromEmbed();
    if (embedded && embedded.messages) loadData(embedded);
    else {
      fetch("transcript.json").then(function (r) { return r.json(); }).then(loadData);
    }
  })();
  </script>
